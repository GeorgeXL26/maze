<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Torch Maze</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #hud { position: fixed; top: 10px; left: 10px; color: #fff; font-family: sans-serif; text-shadow: 0 0 4px #000; }

  #quitBtn {
    position: fixed; top: 14px; right: 62px; z-index: 5;
    font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600;
    color: #ece1c8; background: linear-gradient(180deg, rgba(30,26,20,0.85), rgba(14,12,9,0.9));
    border: 1px solid rgba(236,225,200,0.22); border-radius: 8px;
    padding: 8px 16px; cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  #quitBtn:hover {
    border-color: #ffab52; box-shadow: 0 0 16px -2px #ffab52; transform: translateY(-1px);
  }

  #winModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center; z-index: 10;
    font-family: sans-serif;
  }
  /* #winModal.hidden must win over the plain #winModal rule above — an
     id+class selector outranks a lone id selector. (Learned the hard way
     on the asset wiki's viewer modal: without this, the modal renders as a
     full-screen overlay from page load regardless of the hidden class.) */
  #winModal.hidden { display: none; }
  #winPanel {
    background: #1c1a16; border: 1px solid #4a4030; border-radius: 10px;
    padding: 28px 36px; text-align: center; color: #ece1c8; min-width: 260px;
  }
  #winPanel h2 { margin: 0 0 14px; font-size: 22px; }
  #winStars { font-size: 42px; letter-spacing: 6px; margin-bottom: 10px; }
  #winStars .filled { color: #ffab52; text-shadow: 0 0 10px rgba(255,171,82,0.6); }
  #winStars .empty { color: #4a4030; }
  #winStats { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #b8ac93; margin-bottom: 8px; }
  #winStats .met { color: #7cc47c; }
  #winTime { font-size: 14px; color: #b8ac93; margin-bottom: 18px; }
  #winClose {
    background: #33333b; color: #eee; border: 1px solid #454550; border-radius: 6px;
    padding: 8px 20px; cursor: pointer; font-size: 13px;
  }

  #abilityIcon {
    position: fixed; bottom: 16px; left: 16px; z-index: 5;
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-family: 'Manrope', sans-serif;
    background: linear-gradient(180deg, rgba(30,26,20,0.85), rgba(14,12,9,0.9));
    border: 2px solid rgba(236,225,200,0.22);
    opacity: 0.4; transition: opacity 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  #abilityIcon.hidden { display: none; }
  #abilityIcon.ready {
    opacity: 1; border-color: #ffab52; box-shadow: 0 0 16px -2px #ffab52;
  }
  #abilityIcon.active {
    opacity: 1; border-color: #7cc47c; box-shadow: 0 0 16px -2px #7cc47c;
  }
  #abilityCooldownText {
    position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: #b8ac93; white-space: nowrap;
  }

  #charSelectModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center; z-index: 15;
    font-family: 'Manrope', sans-serif;
  }
  #charSelectModal.hidden { display: none; }
  #charSelectPanel {
    background: #1c1a16; border: 1px solid #4a4030; border-radius: 10px;
    padding: 28px 32px; text-align: center; color: #ece1c8;
  }
  #charSelectPanel h2 { margin: 0 0 20px; font-size: 20px; font-weight: 700; }
  #charSelectGrid { display: flex; gap: 12px; }
  .char-card {
    width: 170px; background: linear-gradient(180deg, rgba(40,32,22,0.7), rgba(16,13,10,0.85));
    border: 2px solid rgba(236,225,200,0.16); border-radius: 8px; padding: 10px;
    cursor: pointer; color: #ece1c8; font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  .char-card:hover {
    border-color: #ffab52; box-shadow: 0 0 16px -2px #ffab52; transform: translateY(-2px);
  }
  .char-card .char-portrait {
    width: 100%; aspect-ratio: 3 / 4; object-fit: contain; display: block;
    background: #14141a; border-radius: 6px; margin-bottom: 8px;
  }
  .char-card .char-name { font-size: 13px; font-weight: 600; }
  .char-card .char-power { font-size: 10.5px; color: #b8ac93; margin-top: 3px; line-height: 1.4; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<button id="quitBtn" type="button">← Quit</button>
<div id="hud">Loading...</div>

<div id="abilityIcon" class="hidden">
  <span id="abilityIconGlyph"></span>
  <span id="abilityCooldownText"></span>
</div>

<div id="charSelectModal" class="hidden">
  <div id="charSelectPanel">
    <h2>Choose your hero</h2>
    <div id="charSelectGrid"></div>
  </div>
</div>

<div id="winModal" class="hidden">
  <div id="winPanel">
    <h2>You escaped!</h2>
    <div id="winStars"></div>
    <div id="winStats"></div>
    <div id="winTime"></div>
    <button id="winClose" type="button">Close</button>
  </div>
</div>
<script src="shared/maze-schema.js"></script>
<script src="shared/toon-renderer.js"></script>
<script src="shared/player-controller.js"></script>
<script src="shared/level-io.js"></script>
<script src="shared/bgm.js"></script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

var gltfLoader = new GLTFLoader();
function loadModel(path) {
  return gltfLoader.loadAsync(path).then(function (gltf) { return gltf.scene; });
}
// Same GLB can be needed more than once (e.g. the Rogue's two daggers are
// the same file, or a weapon happens to double as a thumbnail-phase and
// gameplay-phase load) — cache the load, callers .clone() the result.
var modelCache = {};
function loadModelCached(path) {
  if (!modelCache[path]) modelCache[path] = loadModel(path);
  return modelCache[path];
}

// Each hero permanently wields their signature gear — not a pickup, always
// equipped. hand: 'left' | 'right' picks which side of the fixed hand
// offset (see attachWeapons) a piece mounts on; a class can list more than
// one piece (Knight's sword + shield, Rogue's two daggers).
var CLASS_WEAPONS = {
  knight: [
    { path: 'assets/kaykit-adventurers/assets/sword_1handed.gltf', hand: 'right' },
    { path: 'assets/kaykit-adventurers/assets/shield_round.gltf', hand: 'left' }
  ],
  barbarian: [
    { path: 'assets/kaykit-adventurers/assets/axe_1handed.gltf', hand: 'right' }
  ],
  mage: [
    { path: 'assets/kaykit-adventurers/assets/wand.gltf', hand: 'right' }
  ],
  ranger: [
    { path: 'assets/kaykit-adventurers/assets/bow_withString.gltf', hand: 'left' },
    { path: 'assets/kaykit-adventurers/assets/arrow_bow.gltf', hand: 'right' }
  ],
  rogue: [
    { path: 'assets/kaykit-adventurers/assets/dagger.gltf', hand: 'right' },
    { path: 'assets/kaykit-adventurers/assets/dagger.gltf', hand: 'left' }
  ]
};

// Fixed offsets approximating hand position — not bone-parented to the
// rig (same simplification the earlier weapon-pickup feature used), so
// gear rides along with the character's position/rotation but doesn't
// track individual arm-swing animation.
var WEAPON_SCALE = 0.45;
function attachWeapons(parentMesh, weaponDefs) {
  return Promise.all(weaponDefs.map(function (def) {
    return loadModelCached(def.path).then(function (loaded) {
      var mesh = loaded.clone();
      mesh.scale.set(WEAPON_SCALE, WEAPON_SCALE, WEAPON_SCALE);
      var xOff = def.hand === 'left' ? -0.22 : 0.22;
      mesh.position.set(xOff, 0.55, 0.05);
      mesh.rotation.set(0, 0, def.hand === 'left' ? -Math.PI * 0.15 : Math.PI * 0.15);
      parentMesh.add(mesh);
    });
  }));
}

// Character select — shown once per level load, before the maze itself
// starts. All 5 are kaykit-adventurers models sharing the same rig, so the
// existing Rig_Medium idle/walk clips apply to whichever one is picked.
// ability.kind: 'instant' (jump, ranger-shot — one-shot effect, no active
// window) or 'duration' (sprint/seeing-beyond/invisible — stays active for
// durationMs, tracked per-frame in the game loop).
var CHARACTERS = [
  {
    id: 'knight', label: 'Knight', path: 'assets/kaykit-adventurers/characters/Knight.glb',
    power: 'Sprint — 2x speed for 5s', ability: { kind: 'duration', name: 'sprint', glyph: '💨', cooldownMs: 10000, durationMs: 5000 }
  },
  {
    id: 'barbarian', label: 'Barbarian', path: 'assets/kaykit-adventurers/characters/Barbarian.glb',
    power: 'Jump — leap over a wall', ability: { kind: 'instant', name: 'jump', glyph: '🦘', cooldownMs: 10000 }
  },
  {
    id: 'mage', label: 'Mage', path: 'assets/kaykit-adventurers/characters/Mage.glb',
    power: 'Seeing Beyond — 2x sight for 5s', ability: { kind: 'duration', name: 'seeing-beyond', glyph: '👁️', cooldownMs: 15000, durationMs: 5000 }
  },
  {
    id: 'ranger', label: 'Ranger', path: 'assets/kaykit-adventurers/characters/Ranger.glb',
    power: 'Shot — light/collect through walls', ability: { kind: 'instant', name: 'ranger-shot', glyph: '🎯', cooldownMs: 10000 }
  },
  {
    id: 'rogue', label: 'Rogue', path: 'assets/kaykit-adventurers/characters/Rogue.glb',
    power: 'Invisible — unseen for 5s', ability: { kind: 'duration', name: 'invisible', glyph: '👻', cooldownMs: 15000, durationMs: 5000 }
  }
];

// Renders a small preview image of each hero — same live-render-a-snapshot
// approach as the asset wiki's thumbnails (tools/asset-wiki/app.js), just
// inline here since this is a one-time render of 5 known models rather
// than an on-demand catalog.
// Matches the .char-portrait CSS aspect-ratio (3/4) — a vertical card, not
// the square asset-wiki-style thumbnail this was originally adapted from.
var THUMB_WIDTH = 180;
var THUMB_HEIGHT = 240;
function renderCharacterThumbnails() {
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(THUMB_WIDTH, THUMB_HEIGHT);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(35, THUMB_WIDTH / THUMB_HEIGHT, 0.05, 500);
  scene.add(new THREE.AmbientLight(0xffffff, 2.0));
  var dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
  dirLight.position.set(3, 5, 4);
  scene.add(dirLight);

  // three.js's Box3.setFromObject() only ever reads a mesh's raw, unposed
  // geometry.boundingBox transformed by its own matrixWorld — it has no
  // special case for SkinnedMesh, so it completely ignores GPU bone
  // skinning. These character rigs render in a default pose (arms spread,
  // set by the GLTF's baked bone transforms) that's nothing like their
  // bind-pose geometry, so a Box3-based fit was measuring the wrong shape
  // entirely: a Box3Helper overlay confirmed it landed as a tiny box
  // around the waist while the actual (visible, skinned) head and arms
  // extended far outside it — cropping the real render regardless of how
  // correct the frustum-fit math around that wrong box was.
  //
  // Fix: measure the ACTUAL rendered silhouette instead of trusting mesh
  // geometry. Render once at a generous, guaranteed-not-to-crop guess
  // (any reasonable target/distance works — this only has to not clip),
  // then read the canvas pixels back to find the real on-screen bounding
  // box of the (alpha>0) character. Convert that pixel box back to world
  // units at the guess distance to get the character's true center offset
  // and half-extents, then place the final camera to fill FRAME_FILL of
  // the frame around that corrected center.
  var FRAME_FILL = 0.88;
  function silhouetteBBoxFraction(target, distance, dir) {
    camera.position.copy(target).addScaledVector(dir, distance);
    camera.near = distance * 0.01;
    camera.far = distance * 20;
    camera.updateProjectionMatrix();
    camera.lookAt(target);
    renderer.render(scene, camera);

    var off = document.createElement('canvas');
    off.width = THUMB_WIDTH;
    off.height = THUMB_HEIGHT;
    var ctx = off.getContext('2d');
    ctx.drawImage(renderer.domElement, 0, 0);
    var data = ctx.getImageData(0, 0, THUMB_WIDTH, THUMB_HEIGHT).data;
    var minX = THUMB_WIDTH, maxX = 0, minY = THUMB_HEIGHT, maxY = 0, found = false;
    for (var y = 0; y < THUMB_HEIGHT; y++) {
      for (var x = 0; x < THUMB_WIDTH; x++) {
        if (data[(y * THUMB_WIDTH + x) * 4 + 3] > 10) {
          found = true;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (!found) return null;
    return { fracLeft: minX / THUMB_WIDTH, fracRight: (maxX + 1) / THUMB_WIDTH, fracTop: minY / THUMB_HEIGHT, fracBottom: (maxY + 1) / THUMB_HEIGHT };
  }

  function frame(obj) {
    var dir = new THREE.Vector3(0, 0.15, 1).normalize();
    camera.up.set(0, 1, 0);
    var halfVFovRad = (camera.fov / 2) * (Math.PI / 180);
    var halfHFovRad = Math.atan(camera.aspect * Math.tan(halfVFovRad));

    // Guess: model root is at the origin with feet near y=0 (standard for
    // a game-ready rig), aim roughly chest-height, zoom out generously —
    // distance 8 comfortably contains every one of these 5 characters at
    // any pose regardless of exactly where their true center turns out to be.
    var guessTarget = new THREE.Vector3(0, 0.9, 0);
    var guessDistance = 8;
    var silhouette = silhouetteBBoxFraction(guessTarget, guessDistance, dir);
    if (!silhouette) return; // nothing rendered (shouldn't happen) — leave camera as-is

    // Convert the pixel-space silhouette box back to world units at the
    // guess distance, to get the character's real center offset and
    // half-extents (this is what Box3 was supposed to give us).
    var worldHalfH = guessDistance * Math.tan(halfVFovRad);
    var worldHalfW = guessDistance * Math.tan(halfHFovRad);
    var worldTop = (1 - 2 * silhouette.fracTop) * worldHalfH;
    var worldBottom = (1 - 2 * silhouette.fracBottom) * worldHalfH;
    var worldLeft = (2 * silhouette.fracLeft - 1) * worldHalfW;
    var worldRight = (2 * silhouette.fracRight - 1) * worldHalfW;
    var centerOffsetY = (worldTop + worldBottom) / 2, halfHeight = (worldTop - worldBottom) / 2;
    var centerOffsetX = (worldLeft + worldRight) / 2, halfWidth = (worldRight - worldLeft) / 2;

    var distance = Math.max(
      halfHeight / (FRAME_FILL * Math.tan(halfVFovRad)),
      halfWidth / (FRAME_FILL * Math.tan(halfHFovRad))
    );
    var target = new THREE.Vector3(guessTarget.x + centerOffsetX, guessTarget.y + centerOffsetY, guessTarget.z);

    camera.position.copy(target).addScaledVector(dir, distance);
    camera.near = distance * 0.05;
    camera.far = distance * 10;
    camera.updateProjectionMatrix();
    camera.lookAt(target);
  }

  // Keeps the loaded model on each entry (c.model), not just the
  // snapshot — startGame() reuses it directly instead of fetching and
  // re-parsing the same GLB a second time for the chosen hero. Weapons are
  // attached before the snapshot so the portrait shows each hero with
  // their actual gear, and stay attached afterward (startGame() doesn't
  // need to attach them a second time).
  return Promise.all(CHARACTERS.map(function (c) {
    return loadModel(c.path).then(function (model) {
      return attachWeapons(model, CLASS_WEAPONS[c.id] || []).then(function () {
        scene.add(model);
        frame(model);
        renderer.render(scene, camera);
        c.thumbnail = renderer.domElement.toDataURL('image/png');
        c.model = model;
        scene.remove(model);
      });
    });
  }));
}

function selectCharacter() {
  var modal = document.getElementById('charSelectModal');
  var grid = document.getElementById('charSelectGrid');
  return renderCharacterThumbnails().then(function () {
    return new Promise(function (resolve) {
      CHARACTERS.forEach(function (c) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'char-card';
        card.innerHTML = '<img class="char-portrait" src="' + c.thumbnail + '" alt="' + c.label + '">' +
          '<span class="char-name">' + c.label + '</span>' +
          '<div class="char-power">' + c.power + '</div>';
        card.addEventListener('click', function () {
          modal.classList.add('hidden');
          resolve(c);
        });
        grid.appendChild(card);
      });
      modal.classList.remove('hidden');
    });
  });
}

var winModal = document.getElementById('winModal');
var winStarsEl = document.getElementById('winStars');
var winStatsEl = document.getElementById('winStats');
var winTimeEl = document.getElementById('winTime');
document.getElementById('winClose').addEventListener('click', function () {
  winModal.classList.add('hidden');
});

function showWinModal(stars, elapsedSec, coinsCollected, coinsTotal, torchesLit, torchesTotal) {
  var glyphs = '';
  for (var i = 0; i < 3; i++) {
    glyphs += '<span class="' + (i < stars ? 'filled' : 'empty') + '">★</span>';
  }
  winStarsEl.innerHTML = glyphs;

  var coinsDone = coinsCollected >= coinsTotal;
  var torchesDone = torchesLit >= torchesTotal;
  winStatsEl.innerHTML =
    '<div class="' + (coinsDone ? 'met' : '') + '">' + (coinsDone ? '✓' : '·') + ' Coins: ' + coinsCollected + '/' + coinsTotal + '</div>' +
    '<div class="' + (torchesDone ? 'met' : '') + '">' + (torchesDone ? '✓' : '·') + ' Torches lit: ' + torchesLit + '/' + torchesTotal + '</div>';

  winTimeEl.textContent = elapsedSec + 's to escape';
  winModal.classList.remove('hidden');
}

// Game-event sound cues. No native way to "play only the first N seconds"
// of a file without re-encoding it, so durationSec (when given) just stops
// playback via a timer instead of letting the clip finish naturally.
var AUDIO_BASE = 'assets/audio/';
function playClip(relPath, durationSec, onDone) {
  var audio = new Audio(encodeURI(AUDIO_BASE + relPath));
  audio.play().catch(function (err) {
    // Most likely an autoplay-policy block if this ever fires before any
    // user gesture — not fatal, just no sound that time.
    console.warn('Audio play failed for', relPath, err);
  });
  if (durationSec) {
    setTimeout(function () {
      audio.pause();
      if (onDone) onDone();
    }, durationSec * 1000);
  } else if (onDone) {
    audio.addEventListener('ended', onDone);
  }
  return audio;
}

async function loadManifest() {
  var res = await fetch('levels/manifest.json');
  return res.json();
}

async function loadLevelFile(file) {
  var res = await fetch('levels/' + file);
  return res.json();
}

// Level selection now lives on levels.html — this page only ever receives
// ?level=<id>. A custom level can't fit in a URL, so levels.html stashes
// its already-validated JSON text in localStorage and links here with
// ?level=custom instead of a manifest id.
var CUSTOM_LEVEL_KEY = 'torch-maze-custom-level';
function loadCustomLevelFromStorage() {
  var text = localStorage.getItem(CUSTOM_LEVEL_KEY);
  if (!text) return null;
  var result = window.LevelIO.parseLevelJSON(text);
  return result.ok ? result.data : null;
}

async function startGame(mazeData, character) {
  var check = window.MazeSchema.validateMazeData(mazeData);
  if (!check.valid) { console.error('Invalid level:', check.errors); return; }

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05050a);

  var camera = window.ToonRenderer.createFollowCamera(THREE, window.innerWidth / window.innerHeight);

  var PLAYER_VISIBILITY_RADIUS = 2.2;
  var TORCH_VISIBILITY_RADIUS = 3.2;
  var FOW_SOFTNESS = 1.3;
  var fowUniformRefs = [];

  function applyFogOfWar(material) {
    material.onBeforeCompile = function (shader) {
      shader.uniforms.uLightCenters = { value: [] };
      for (var i = 0; i < 8; i++) shader.uniforms.uLightCenters.value.push(new THREE.Vector4(0, 0, 0, 0));
      shader.uniforms.uLightCount = { value: 0 };
      shader.uniforms.uSoftness = { value: FOW_SOFTNESS };

      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vFowWorldPos;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvFowWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');

      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vFowWorldPos;\nuniform vec4 uLightCenters[8];\nuniform int uLightCount;\nuniform float uSoftness;')
        .replace('#include <dithering_fragment>', [
          'float fowVis = 0.0;',
          'for (int i = 0; i < 8; i++) {',
          '  if (i >= uLightCount) break;',
          '  vec4 c = uLightCenters[i];',
          '  float d = distance(vFowWorldPos.xz, c.xz);',
          '  float v = 1.0 - smoothstep(c.w, c.w + uSoftness, d);',
          '  fowVis = max(fowVis, v);',
          '}',
          'gl_FragColor.rgb *= fowVis;',
          '#include <dithering_fragment>'
        ].join('\n'));

      fowUniformRefs.push(shader.uniforms);
    };
    material.needsUpdate = true;
  }

  function collectMaterials(root) {
    var mats = [];
    root.traverse(function (obj) {
      if (obj.material) {
        if (Array.isArray(obj.material)) mats = mats.concat(obj.material);
        else mats.push(obj.material);
      }
    });
    return mats;
  }

  var WALL_SCALE = 0.25;
  var PLAYER_SCALE = 0.41;
  var PLAYER_FOOT_OFFSET = 0.42 * PLAYER_SCALE;

  var wallTemplates = {
    straight: await loadModel('assets/kaykit-dungeon/gltf/wall.gltf'),
    corner: await loadModel('assets/kaykit-dungeon/gltf/wall_corner.gltf'),
    tsplit: await loadModel('assets/kaykit-dungeon/gltf/wall_Tsplit.gltf'),
    crossing: await loadModel('assets/kaykit-dungeon/gltf/wall_crossing.gltf')
  };
  Object.keys(wallTemplates).forEach(function (key) {
    wallTemplates[key].scale.set(WALL_SCALE, WALL_SCALE, WALL_SCALE);
  });
  var torchUnlitTemplate = await loadModel('assets/kaykit-dungeon/gltf/torch.gltf');
  var torchLitTemplate = await loadModel('assets/kaykit-dungeon/gltf/torch_lit.gltf');
  var coinTemplate = await loadModel('assets/kaykit-dungeon/gltf/coin.gltf');
  var exitFlagTemplate = await loadModel('assets/kaykit-dungeon/gltf/banner_red.gltf');
  // Still named knightTemplate for minimal diff against the rest of this
  // function — it's actually whichever hero was chosen on the character
  // select screen. selectCharacter() already loaded that model (and
  // attached its weapons) once for the portrait, so this reuses it
  // directly instead of fetching and re-parsing the same GLB again; falls
  // back to a fresh Knight with no weapons if none was passed in (e.g.
  // startGame() called directly).
  var knightTemplate = (character && character.model) || await loadModel('assets/kaykit-adventurers/characters/Knight.glb');
  knightTemplate.scale.set(PLAYER_SCALE, PLAYER_SCALE, PLAYER_SCALE);

  Object.keys(wallTemplates).map(function (k) { return wallTemplates[k]; })
    .concat([torchUnlitTemplate, torchLitTemplate, coinTemplate, exitFlagTemplate, knightTemplate])
    .forEach(function (tpl) {
      collectMaterials(tpl).forEach(applyFogOfWar);
    });

  var idleGltf = await gltfLoader.loadAsync('assets/kaykit-adventurers/animations/Rig_Medium_General.glb');
  var walkGltf = await gltfLoader.loadAsync('assets/kaykit-adventurers/animations/Rig_Medium_MovementBasic.glb');
  var idleClip = idleGltf.animations.find(function (a) { return a.name === 'Idle_A'; });
  var walkClip = walkGltf.animations.find(function (a) { return a.name === 'Walking_A'; });

  var mixer = new THREE.AnimationMixer(knightTemplate);
  var idleAction = mixer.clipAction(idleClip);
  var walkAction = mixer.clipAction(walkClip);
  idleAction.play();
  var isWalking = false;
  function setWalking(walking) {
    if (walking === isWalking) return;
    isWalking = walking;
    if (walking) {
      idleAction.fadeOut(0.15);
      walkAction.reset().fadeIn(0.15).play();
    } else {
      walkAction.fadeOut(0.15);
      idleAction.reset().fadeIn(0.15).play();
    }
  }

  var mazeMesh = window.MazeSchema.buildMazeMesh(mazeData, THREE, wallTemplates);
  scene.add(mazeMesh);
  mazeMesh.children.forEach(function (c) {
    if (c.userData.type === 'floor') applyFogOfWar(c.material);
  });

  // Safe to keep now: the fog-of-war shader mask independently zeroes
  // everything past the visibility radius, so ambient no longer leaks
  // visibility into unlit areas — it only affects in-range shading quality.
  var ambient = new THREE.AmbientLight(0x778899, 1.8);
  scene.add(ambient);

  var TORCH_LIGHT_RADIUS = 1.2;
  var torchObjects = mazeData.torches.map(function (t) {
    var mesh = torchUnlitTemplate.clone();
    mesh.position.set(t.x, 0, t.y);
    scene.add(mesh);

    var light = new THREE.PointLight(0xffaa44, 0, 4);
    light.position.set(t.x, 1.0, t.y);
    scene.add(light);

    return { data: t, mesh: mesh, light: light, lit: false };
  });
  var lastLitTorchIndex = -1;

  // Shared by the ordinary walk-up-and-light proximity check below and the
  // Ranger's shoot-through-walls ability — both just need "make torch idx
  // lit", so the actual mesh-swap/sound logic lives in one place.
  function igniteTorch(idx) {
    var torchObj = torchObjects[idx];
    torchObj.lit = true;
    torchObj.light.intensity = 15;
    scene.remove(torchObj.mesh);
    torchObj.mesh = torchLitTemplate.clone();
    torchObj.mesh.position.set(torchObj.data.x, 0, torchObj.data.y);
    scene.add(torchObj.mesh);
    lastLitTorchIndex = idx;
    playClip('kenney-music-jingles/8-Bit jingles/jingles_NES00.ogg');
  }

  var EXIT_FLAG_SCALE = 0.4;
  var exitFlagMesh = exitFlagTemplate.clone();
  exitFlagMesh.scale.set(EXIT_FLAG_SCALE, EXIT_FLAG_SCALE, EXIT_FLAG_SCALE);
  exitFlagMesh.position.set(mazeData.exit.x, 0, mazeData.exit.y);
  scene.add(exitFlagMesh);

  var ITEM_PICKUP_RADIUS = 0.5;
  var itemMeshes = mazeData.items.map(function (it) {
    var mesh = coinTemplate.clone();
    mesh.position.set(it.x, 0.15, it.y);
    scene.add(mesh);
    return { data: it, mesh: mesh, collected: false };
  });
  var collectedCount = 0;
  var gameWon = false;

  // Shared by the ordinary walk-over pickup check below and the Ranger's
  // shoot-through-walls ability — both just need "collect item idx".
  function collectItemAt(idx) {
    itemMeshes[idx].collected = true;
    scene.remove(itemMeshes[idx].mesh);
    collectedCount++;
    playClip('kenney-music-jingles/Pizzicato jingles/jingles_PIZZI01.ogg', null, function () {
      playClip('kenney-rpg-audio/handleCoins.ogg');
    });
  }

  var playerPos = { x: mazeData.start.x, z: mazeData.start.y };
  window.ToonRenderer.updateFollowCamera(camera, { x: playerPos.x, y: 0, z: playerPos.z });

  var playerMesh = knightTemplate;
  playerMesh.position.set(playerPos.x, PLAYER_FOOT_OFFSET, playerPos.z);
  scene.add(playerMesh);

  var playerLight = new THREE.PointLight(0xffddaa, 10, 3.5);
  scene.add(playerLight);

  var input = { forward: false, back: false, left: false, right: false };
  var keyMap = { KeyW: 'forward', KeyS: 'back', KeyA: 'left', KeyD: 'right' };
  window.addEventListener('keydown', function (e) { if (keyMap[e.code]) input[keyMap[e.code]] = true; });
  window.addEventListener('keyup', function (e) { if (keyMap[e.code]) input[keyMap[e.code]] = false; });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'KeyE' && lastLitTorchIndex !== -1) {
      var t = mazeData.torches[lastLitTorchIndex];
      playerPos.x = t.x;
      playerPos.z = t.y;
    }
  });

  // --- Hero superpower (Space bar) ---------------------------------------
  // facingDx/facingDz is a grid-snapped cardinal direction (one axis zero,
  // the other +-1) — the only per-frame movement tracking, moveDx/moveDz
  // below, are just the current input flags and go blank the instant the
  // player releases the keys, so Jump/Ranger's "which way am I facing"
  // needs its own persistent copy. Diagonal input snaps to the z-axis
  // (forward/back) so Jump and the Ranger's shot always travel along a
  // single grid line rather than an ambiguous diagonal.
  var ability = character && character.ability;
  var abilityState = { readyAt: 0, activeUntil: 0 };
  var facingDx = 0, facingDz = -1; // default: facing forward/north (W)

  var abilityIconEl = document.getElementById('abilityIcon');
  var abilityGlyphEl = document.getElementById('abilityIconGlyph');
  var abilityCooldownEl = document.getElementById('abilityCooldownText');
  if (ability) {
    abilityIconEl.classList.remove('hidden');
    abilityIconEl.classList.add('ready');
    abilityGlyphEl.textContent = ability.glyph;
  }

  // Jump plays out as an actual hop over JUMP_DURATION_MS — a lerped
  // horizontal path plus a sine-arc vertical lift and a squash/stretch on
  // the mesh — rather than an instant teleport from A to B. animate()
  // drives the interpolation every frame using jumpAnim's start time.
  var jumpAnim = null;
  var JUMP_DURATION_MS = 450;
  var JUMP_HEIGHT = 0.9;

  function doJump() {
    if (jumpAnim) return; // already mid-hop (shouldn't happen — cooldown outlasts the hop)
    var gx = Math.round(playerPos.x) + facingDx * 2;
    var gz = Math.round(playerPos.z) + facingDz * 2;
    // Only lands if the far cell is floor — a wall (or the maze boundary)
    // in the way just wastes the cooldown, matching a real "leap and
    // faceplant" risk rather than silently no-opping.
    if (!window.MazeSchema.isWalkable(mazeData, gx, gz)) return;
    jumpAnim = { fromX: playerPos.x, fromZ: playerPos.z, toX: gx, toZ: gz, startMs: performance.now(), durationMs: JUMP_DURATION_MS };
  }

  function doRangerShot() {
    for (var step = 1; step <= 6; step++) {
      var gx = Math.round(playerPos.x) + facingDx * step;
      var gz = Math.round(playerPos.z) + facingDz * step;
      var torchIdx = torchObjects.findIndex(function (t) { return !t.lit && t.data.x === gx && t.data.y === gz; });
      if (torchIdx !== -1) { igniteTorch(torchIdx); return; }
      var itemIdx = itemMeshes.findIndex(function (it) { return !it.collected && it.data.x === gx && it.data.y === gz; });
      if (itemIdx !== -1) { collectItemAt(itemIdx); return; }
    }
  }

  function triggerAbility() {
    if (!ability || gameWon) return;
    var now = performance.now();
    if (now < abilityState.readyAt) return; // still on cooldown
    abilityState.readyAt = now + ability.cooldownMs;
    if (ability.kind === 'duration') abilityState.activeUntil = now + ability.durationMs;
    if (ability.name === 'jump') doJump();
    else if (ability.name === 'ranger-shot') doRangerShot();
    // sprint / seeing-beyond / invisible have no one-shot effect here — the
    // game loop below reads abilityState.activeUntil every frame instead.
  }
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); triggerAbility(); }
  });

  var clock = new THREE.Clock();
  var PLAYER_SPEED = 2.5;
  var PLAYER_RADIUS = 0.3;

  window.addEventListener('resize', function () {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  document.getElementById('hud').textContent = 'Torch Maze — level loaded';
  var levelBGM = window.BGM.mount('haunted-mansion', 0.5);
  var levelStartTime = performance.now();

  function animate() {
    requestAnimationFrame(animate);
    var dt = clock.getDelta();
    var now = performance.now();
    var abilityActive = !!ability && ability.kind === 'duration' && now < abilityState.activeUntil;

    // Mid-hop: drive the lerp/arc from jumpAnim and skip ordinary
    // WASD movement + wall collision entirely (that's the whole point —
    // clearing a wall the player couldn't otherwise walk through).
    var jumpT = null;
    if (jumpAnim) {
      jumpT = (now - jumpAnim.startMs) / jumpAnim.durationMs;
      if (jumpT >= 1) {
        playerPos.x = jumpAnim.toX;
        playerPos.z = jumpAnim.toZ;
        jumpAnim = null;
        jumpT = null;
      } else {
        playerPos.x = jumpAnim.fromX + (jumpAnim.toX - jumpAnim.fromX) * jumpT;
        playerPos.z = jumpAnim.fromZ + (jumpAnim.toZ - jumpAnim.fromZ) * jumpT;
      }
    }

    if (!jumpAnim) {
      var moveSpeed = PLAYER_SPEED * ((ability && ability.name === 'sprint' && abilityActive) ? 2 : 1);
      var intended = window.PlayerController.computeMove({ x: playerPos.x, z: playerPos.z }, input, dt, moveSpeed);
      var resolved = window.PlayerController.resolveCollision({ x: playerPos.x, z: playerPos.z }, intended, PLAYER_RADIUS, mazeData);
      playerPos.x = resolved.x;
      playerPos.z = resolved.z;
    }

    // Sine arc for the vertical hop (peaks at the midpoint, zero at
    // takeoff/landing) plus a matching squash/stretch — squat-shaped at
    // the ends, stretched tall at the apex — so it reads as a kangaroo-ish
    // hop instead of a smooth glide.
    var jumpLift = jumpT !== null ? Math.sin(jumpT * Math.PI) * JUMP_HEIGHT : 0;
    var jumpStretch = jumpT !== null ? 1 + 0.15 * Math.sin(jumpT * Math.PI) : 1;
    playerMesh.position.set(playerPos.x, PLAYER_FOOT_OFFSET + jumpLift, playerPos.z);
    playerMesh.scale.set(PLAYER_SCALE, PLAYER_SCALE * jumpStretch, PLAYER_SCALE);
    var moveDx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    var moveDz = (input.back ? 1 : 0) - (input.forward ? 1 : 0);
    if (moveDx !== 0 || moveDz !== 0) {
      playerMesh.rotation.y = Math.atan2(moveDx, moveDz);
      // Grid-snapped facing for Jump/Ranger — see the comment where these
      // vars are declared. z-axis wins ties so diagonal input still picks
      // one clean cardinal direction.
      if (moveDz !== 0) { facingDx = 0; facingDz = moveDz; }
      else { facingDx = moveDx; facingDz = 0; }
    }
    setWalking(jumpT === null && (moveDx !== 0 || moveDz !== 0));
    mixer.update(dt);

    if (ability && ability.name === 'invisible') {
      var invisOpacity = abilityActive ? 0.4 : 1;
      collectMaterials(playerMesh).forEach(function (m) { m.transparent = true; m.opacity = invisOpacity; });
    }

    if (ability) {
      var cooldownRemainMs = abilityState.readyAt - now;
      if (abilityActive) {
        abilityIconEl.classList.add('active');
        abilityIconEl.classList.remove('ready');
        abilityCooldownEl.textContent = '';
      } else if (cooldownRemainMs > 0) {
        abilityIconEl.classList.remove('active', 'ready');
        abilityCooldownEl.textContent = Math.ceil(cooldownRemainMs / 1000) + 's';
      } else {
        abilityIconEl.classList.add('ready');
        abilityIconEl.classList.remove('active');
        abilityCooldownEl.textContent = '';
      }
    }
    window.ToonRenderer.updateFollowCamera(camera, { x: playerPos.x, y: 0, z: playerPos.z });
    playerLight.position.set(playerPos.x, 0.6, playerPos.z);

    var nearbyIdx = window.PlayerController.findNearbyTorch(
      { x: playerPos.x, z: playerPos.z },
      mazeData.torches,
      TORCH_LIGHT_RADIUS
    );
    if (nearbyIdx !== -1 && !torchObjects[nearbyIdx].lit) {
      igniteTorch(nearbyIdx);
    }

    if (!gameWon) {
      var itemIdx = window.PlayerController.findNearbyItem(
        { x: playerPos.x, z: playerPos.z },
        mazeData.items,
        ITEM_PICKUP_RADIUS
      );
      if (itemIdx !== -1 && !itemMeshes[itemIdx].collected) {
        collectItemAt(itemIdx);
      }

      // Winning only requires reaching the exit — the "all items"/"all
      // torches" bonuses are tracked separately as stars, not gates.
      var exitDx = playerPos.x - mazeData.exit.x;
      var exitDz = playerPos.z - mazeData.exit.y;
      var atExit = (exitDx * exitDx + exitDz * exitDz) <= (0.6 * 0.6);
      if (atExit) {
        gameWon = true;
        levelBGM.pause();
        playClip('16bit-retro-music-collection/Victory Arc.m4a');

        var torchesLitCount = torchObjects.filter(function (t) { return t.lit; }).length;
        var stars = 1; // reaching the exit always earns the first star
        if (collectedCount >= mazeData.items.length) stars++;
        if (torchesLitCount >= torchObjects.length) stars++;
        var elapsedSec = Math.round((performance.now() - levelStartTime) / 1000);
        showWinModal(stars, elapsedSec, collectedCount, mazeData.items.length, torchesLitCount, torchObjects.length);
      }
    }

    document.getElementById('hud').textContent =
      gameWon ? 'Cleared! Collected ' + collectedCount + '/' + mazeData.items.length + ' coins'
              : 'Coins ' + collectedCount + '/' + mazeData.items.length + ' — WASD to move, E to return to last torch' +
                (ability ? ', Space for ' + character.label + '’s power' : '');

    var playerVisRadius = PLAYER_VISIBILITY_RADIUS * ((ability && ability.name === 'seeing-beyond' && abilityActive) ? 2 : 1);
    var fowCenters = [{ x: playerPos.x, z: playerPos.z, r: playerVisRadius }];
    torchObjects.forEach(function (t) {
      if (t.lit) fowCenters.push({ x: t.data.x, z: t.data.y, r: TORCH_VISIBILITY_RADIUS });
    });
    var fowCount = Math.min(fowCenters.length, 8);
    fowUniformRefs.forEach(function (u) {
      for (var i = 0; i < fowCount; i++) {
        u.uLightCenters.value[i].set(fowCenters[i].x, 0, fowCenters[i].z, fowCenters[i].r);
      }
      u.uLightCount.value = fowCount;
    });

    renderer.render(scene, camera);
  }
  animate();
}

document.getElementById('quitBtn').addEventListener('click', function () {
  window.location.href = 'levels.html';
});

var requestedId = new URLSearchParams(window.location.search).get('level');

function loadLevelData() {
  if (requestedId === 'custom') {
    var customData = loadCustomLevelFromStorage();
    if (customData) return Promise.resolve(customData);
    alert('No custom level found — pick a level again.');
    window.location.href = 'levels.html';
    return new Promise(function () {}); // navigating away — never resolves
  }
  return loadManifest().then(function (manifest) {
    var entry = manifest.find(function (e) { return e.id === requestedId; }) || manifest[0];
    return loadLevelFile(entry.file);
  });
}

// Level fetch and character selection happen in parallel — no reason to
// make the player wait for one before starting the other.
Promise.all([loadLevelData(), selectCharacter()]).then(function (results) {
  startGame(results[0], results[1]);
});
</script>
</body>
</html>
