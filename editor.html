<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Torch Maze — 地图编辑器</title>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; }
  #toolbar { padding: 12px; display: flex; flex-direction: column; gap: 6px; width: 160px; flex-shrink: 0; }
  #toolbar button { padding: 8px; cursor: pointer; }
  #toolbar button.active { background: #ffd966; font-weight: bold; }
  #canvasWrap { overflow: auto; width: 100%; height: 100vh; }
  canvas { border: 1px solid #333; image-rendering: pixelated; cursor: crosshair; }
</style>
</head>
<body>
<div id="toolbar">
  <div>工具</div>
  <button data-tool="wall" class="active">墙 (Wall)</button>
  <button data-tool="floor">地板 (Floor)</button>
  <button data-tool="torch">火把 (Torch)</button>
  <button data-tool="item">道具 (Item)</button>
  <button data-tool="start">起点 (Start)</button>
  <button data-tool="exit">终点 (Exit)</button>
  <hr>
  <div>网格尺寸（最大 200x200）</div>
  <div style="display:flex; gap:4px;">
    <input id="widthInput" type="number" value="15" min="3" max="200" style="width:50px;">
    <input id="heightInput" type="number" value="15" min="3" max="200" style="width:50px;">
    <button id="resizeBtn">调整</button>
  </div>
  <hr>
  <button id="exportBtn">导出 JSON</button>
  <input id="importInput" type="file" accept="application/json">
  <div style="font-size:12px; color:#666;">提示：拖动已放置的火把/道具/起点/终点图标可以移动它们；单击可以放置/删除。</div>
</div>
<div id="canvasWrap">
<canvas id="grid" width="480" height="480"></canvas>
</div>
<script src="shared/maze-schema.js"></script>
<script src="shared/level-io.js"></script>
<script src="shared/editor-grid.js"></script>
<script>
  var CELL_SIZE = 32;
  var data = window.LevelIO.createDefaultLevel(15, 15);
  var currentTool = window.EditorGrid.TOOLS.WALL;
  var canvas = document.getElementById('grid');
  var ctx = canvas.getContext('2d');

  document.querySelectorAll('#toolbar button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#toolbar button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentTool = btn.dataset.tool;
    });
  });

  function cellFromEvent(evt) {
    var rect = canvas.getBoundingClientRect();
    return window.EditorGrid.pixelToCell(evt.clientX - rect.left, evt.clientY - rect.top, CELL_SIZE);
  }

  function paintAt(evt) {
    var cell = cellFromEvent(evt);
    window.EditorGrid.applyTool(data, currentTool, cell.x, cell.y);
    render();
  }

  function findEntityAt(x, y) {
    if (data.start.x === x && data.start.y === y) return { kind: 'start' };
    if (data.exit.x === x && data.exit.y === y) return { kind: 'exit' };
    for (var i = 0; i < data.torches.length; i++) {
      if (data.torches[i].x === x && data.torches[i].y === y) return { kind: 'torch', index: i };
    }
    for (var i = 0; i < data.items.length; i++) {
      if (data.items[i].x === x && data.items[i].y === y) return { kind: 'item', index: i };
    }
    return null;
  }

  function moveEntity(entity, x, y) {
    if (x < 0 || y < 0 || x >= data.width || y >= data.height) return;
    if (entity.kind === 'start') data.start = { x: x, y: y };
    else if (entity.kind === 'exit') data.exit = { x: x, y: y };
    else if (entity.kind === 'torch') { data.torches[entity.index].x = x; data.torches[entity.index].y = y; }
    else if (entity.kind === 'item') { data.items[entity.index].x = x; data.items[entity.index].y = y; }
  }

  var painting = false;
  var dragState = null;

  canvas.addEventListener('mousedown', function (e) {
    var cell = cellFromEvent(e);
    var entity = findEntityAt(cell.x, cell.y);
    if (entity) {
      dragState = { entity: entity, x: cell.x, y: cell.y, moved: false };
    } else {
      painting = true;
      paintAt(e);
    }
  });

  canvas.addEventListener('mousemove', function (e) {
    if (dragState) {
      var cell = cellFromEvent(e);
      if (cell.x !== dragState.x || cell.y !== dragState.y) {
        dragState.moved = true;
        dragState.x = cell.x;
        dragState.y = cell.y;
        moveEntity(dragState.entity, cell.x, cell.y);
        render();
      }
    } else if (painting) {
      paintAt(e);
    }
  });

  window.addEventListener('mouseup', function () {
    if (dragState && !dragState.moved) {
      // Plain click on an existing marker (no drag): fall back to the
      // active tool's click behavior (e.g. toggling it off).
      window.EditorGrid.applyTool(data, currentTool, dragState.x, dragState.y);
      render();
    }
    dragState = null;
    painting = false;
  });

  function render() {
    canvas.width = data.width * CELL_SIZE;
    canvas.height = data.height * CELL_SIZE;
    for (var y = 0; y < data.height; y++) {
      for (var x = 0; x < data.width; x++) {
        ctx.fillStyle = data.cells[y][x] === '#' ? '#444455' : '#dddde8';
        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        ctx.strokeStyle = '#00000022';
        ctx.strokeRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      }
    }
    data.torches.forEach(function (t) {
      ctx.fillStyle = '#ff8800';
      ctx.beginPath();
      ctx.arc(t.x * CELL_SIZE + CELL_SIZE/2, t.y * CELL_SIZE + CELL_SIZE/2, CELL_SIZE*0.25, 0, Math.PI*2);
      ctx.fill();
    });
    data.items.forEach(function (it) {
      ctx.fillStyle = '#3399ff';
      ctx.fillRect(it.x*CELL_SIZE+CELL_SIZE*0.3, it.y*CELL_SIZE+CELL_SIZE*0.3, CELL_SIZE*0.4, CELL_SIZE*0.4);
    });
    ctx.fillStyle = '#22cc55';
    ctx.fillRect(data.start.x*CELL_SIZE+4, data.start.y*CELL_SIZE+4, CELL_SIZE-8, CELL_SIZE-8);
    ctx.fillStyle = '#cc2255';
    ctx.fillRect(data.exit.x*CELL_SIZE+4, data.exit.y*CELL_SIZE+4, CELL_SIZE-8, CELL_SIZE-8);
  }

  document.getElementById('resizeBtn').addEventListener('click', function () {
    var w = parseInt(document.getElementById('widthInput').value, 10);
    var h = parseInt(document.getElementById('heightInput').value, 10);
    data = window.EditorGrid.resizeGrid(data, w, h);
    render();
  });

  document.getElementById('exportBtn').addEventListener('click', function () {
    var blob = new Blob([window.LevelIO.exportLevelJSON(data)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'level.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('importInput').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var result = window.LevelIO.parseLevelJSON(reader.result);
      if (!result.ok) { alert('导入失败：' + result.errors.join(', ')); return; }
      data = result.data;
      document.getElementById('widthInput').value = data.width;
      document.getElementById('heightInput').value = data.height;
      render();
    };
    reader.readAsText(file);
  });

  render();
</script>
</body>
</html>
